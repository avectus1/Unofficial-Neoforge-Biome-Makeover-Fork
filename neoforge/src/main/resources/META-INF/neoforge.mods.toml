modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "biomemakeover"
version = "${version}"
displayName = "Biome Makeover Refoxed"
authors = "LASERKNIGHTS (Lemonszz), eirmax, avectus1"
description = '''
Biome Makeover is a mod designed to update vanilla's biomes.

Unofficial NeoForge 1.21.1 port, based on eirmax's Biome Makeover Continuation. Not affiliated with LASER KNIGHTS.
'''
logoFile = "refoxed-logo.png"

[[dependencies.biomemakeover]]
modId = "neoforge"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.biomemakeover]]
modId = "minecraft"
versionRange = "[1.21.1,1.21.2)"
ordering = "NONE"
side = "BOTH"

[[dependencies.biomemakeover]]
modId = "architectury"
versionRange = "[13.0.11,)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "biomemakeover-common.mixins.json"

[[mixins]]
config = "biomemakeover-neoforge.mixins.json"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"
